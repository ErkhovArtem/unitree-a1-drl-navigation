services:
  ros-melodic:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ros_melodic_container
    restart: unless-stopped
    network_mode: host
    environment:
      - DISPLAY=${DISPLAY}
      - XDG_RUNTIME_DIR=/tmp/runtime-root
      - QT_X11_NO_MITSHM=1
      - _X11_NO_MITSHM=1
      - MITSHM=OFF
      # Uncomment if RViz fails with libGL/GLX (software OpenGL)
      # - LIBGL_ALWAYS_SOFTWARE=1
      - ROS_MASTER_URI=${ROS_MASTER_URI:-http://192.168.123.12:11311}
      - ROS_IP
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
    privileged: true
    volumes:
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # - ../:/workspace:rw
      - ../dog_lplanner:/root/catkin_ws/src/dog_lplanner:rw
      - ../unitree_legged_msgs:/root/catkin_ws/src/unitree_legged_msgs:rw
      - ./init_container.sh:/init_container.sh:ro
    stdin_open: true
    tty: true
    command: bash -lc "bash /init_container.sh && sleep infinity"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
