# Конфигурация для инференса политики в ROS1 Melodic
# Адаптировано из configs/a1.yaml для ROS1

# Масштаб выходных команд [vx, vy, w] (м/с, м/с, рад/с)
cmd_scale: [0.3, 0.3, 0.3]

# Параметры лидара
min_lidar_range: 0.25  # Минимальная дальность (м), исключаем робота
max_lidar_range: 3.0   # Максимальная дальность (м)
num_sectors: 40        # Количество секторов

# Параметры нормализации
max_angular_vel: 0.35  # Максимальная угловая скорость для нормализации (рад/с)
max_distance: 10.75    # Максимальное расстояние до цели (м)

# Параметры SAC политики
sac:
  history_length: 3        # Длина истории действий для Actor
  critic_history_length: 3  # Длина истории для Critic (не используется в инференсе)

# Пути к файлам (относительно директории dog_lplanner)
model_path: "sac_actor.onnx"
config_path: "config/a1_ros1.yaml"

# ROS топики
scan_topic: "/scan"
high_state_topic: "/high_state"  # unitree_legged_msgs/HighState, угловая скорость rotateSpeed
clicked_point_topic: "/clicked_point"  # Топик для целевой точки из RViz
high_cmd_topic: "/high_cmd"

# Фреймы для tf преобразований
map_frame: "map"  # Фрейм карты (откуда приходит clicked_point)
base_frame: "base_link"  # Локальный фрейм робота

# Параметры цели (fallback, если нет clicked_point)
target_x: 5.0  # Координата X цели (м) - используется только если clicked_point не получен
target_y: 0.0  # Координата Y цели (м) - используется только если clicked_point не получен

# Частота инференса (Hz)
inference_rate: 10.0
