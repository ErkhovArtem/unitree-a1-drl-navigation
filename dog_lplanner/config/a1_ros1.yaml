# Policy inference (ROS1 Melodic). Derived from training config configs/a1.yaml.

# Output command scale [vx, vy, w] (m/s, m/s, rad/s) applied after tanh policy output
cmd_scale: [0.5, 0.5, 0.5]

# Lidar sector pipeline
min_lidar_range: 0.25  # Drop returns closer than this (robot body), meters
max_lidar_range: 3.0
num_sectors: 40

# Observation normalization
max_angular_vel: 0.35  # rad/s, for angular velocity channel
max_distance: 10.75    # meters, for goal distance normalization

# SAC (history used at inference)
sac:
  history_length: 3
  critic_history_length: 3  # Training only; not used in this ONNX inference path

# Paths relative to dog_lplanner package root unless overridden by ROS params
model_path: "sac_actor.onnx"
config_path: "config/a1_ros1.yaml"

# ROS topics (documentation; node params may override)
scan_topic: "/scan"
high_state_topic: "/high_state"  # unitree_legged_msgs/HighState; use rotateSpeed for w
clicked_point_topic: "/clicked_point"
high_cmd_topic: "/high_cmd"

# TF frames
map_frame: "map"
base_frame: "base_link"

# Default goal in base_link if no /clicked_point received yet
target_x: 5.0
target_y: 0.0

inference_rate: 10.0

# Stop policy when distance to goal in base_link is below this (meters); sets /policy_running false
goal_reached_distance: 0.2
